name: Build Buzz CLI

# Pull requests and manual runs: build and validate every target. Never publishes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzz-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recipe-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and build safeguards
        run: python3 -m unittest discover -s tests -v

  linux-x64:
    needs: recipe-tests
    uses: ./.github/workflows/target.yml
    with:
      target: x86_64-unknown-linux-musl
      runner: ubuntu-24.04
      publish: false
  linux-arm64:
    needs: recipe-tests
    uses: ./.github/workflows/target.yml
    with:
      target: aarch64-unknown-linux-musl
      runner: ubuntu-24.04-arm
      publish: false
  macos-arm64:
    needs: recipe-tests
    uses: ./.github/workflows/target.yml
    with:
      target: aarch64-apple-darwin
      runner: macos-15
      publish: false
  macos-x64:
    needs: recipe-tests
    uses: ./.github/workflows/target.yml
    with:
      target: x86_64-apple-darwin
      runner: macos-15-intel
      publish: false
  windows-x64:
    needs: recipe-tests
    uses: ./.github/workflows/target.yml
    with:
      target: x86_64-pc-windows-msvc
      runner: windows-2025
      publish: false

  verify-release:
    name: Verify complete release matrix
    needs: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-cli-*
          path: dist/inputs
          merge-multiple: false
      - name: Validate all receipts, tests, archives and checksums
        env:
          RECIPE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py --input dist/inputs --output dist/release --recipe-commit "$RECIPE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
