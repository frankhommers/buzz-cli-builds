name: Build Buzz CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No build job can publish releases or modify the repository.
permissions:
  contents: read

concurrency:
  group: buzz-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recipe-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and build safeguards
        run: python3 -m unittest discover -s tests -v

  build:
    needs: recipe-tests
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package pinned upstream CLI
        run: python3 scripts/build.py --target "${{ matrix.target }}" --output "dist/${{ matrix.target }}"
      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            work/**/logs/*.log
            work/**/docker-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-cli-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-release:
    name: Verify complete release matrix
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-cli-*
          path: dist/inputs
          merge-multiple: false
      - name: Validate all receipts, tests, archives and checksums
        env:
          RECIPE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py --input dist/inputs --output dist/release --recipe-commit "$RECIPE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
