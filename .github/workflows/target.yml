name: Build one target

# Reusable: builds, tests and packages one target with read-only permissions, then
# publishes it on its own as soon as it passes (or only validates it, for pull requests).
on:
  workflow_call:
    inputs:
      target: {type: string, required: true}
      runner: {type: string, required: true}
      publish: {type: boolean, required: true}

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package pinned upstream CLI
        run: python3 scripts/build.py --target "${{ inputs.target }}" --output "dist/${{ inputs.target }}"
      - name: Collect failed build logs without traversing profiles
        if: failure()
        run: python3 scripts/collect_logs.py
      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ inputs.target }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-cli-${{ inputs.target }}
          path: dist/${{ inputs.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    # Permissions come from the caller: read for pull requests (validation only),
    # contents: write only from release.yml on main.
    name: Publish ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-cli-${{ inputs.target }}
          path: dist/target
      - name: Validate and publish this target
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE_COMMIT: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mode=()
          [ "$PUBLISH" = true ] || mode=(--dry-run)
          python3 scripts/publish.py target --repo "$GITHUB_REPOSITORY" --recipe-commit "$RECIPE_COMMIT" \
            --target "$TARGET" --input dist/target "${mode[@]}"
